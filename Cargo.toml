[package]
name = "eqterm"
version = "0.2.0"
edition = "2024"
description = "Vim-first terminal music player with AutoEq headphone/IEM presets"
license = "MIT"
readme = "README.md"
keywords = ["music", "tui", "eq", "autoeq", "mpv"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
dirs = "5.0"
libmpv2 = "5.0"
once_cell = "1.19"
ratatui = "0.27"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
walkdir = "2.5"
zip = "0.6"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
